name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          sha256sum keystore.jks

      - name: Build unsigned APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          STORE_PASSWORD_B64: ${{ secrets.STORE_PASSWORD_B64 }}
          KEY_PASSWORD_B64: ${{ secrets.KEY_PASSWORD_B64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          STORE_PASSWORD=$(printf '%s' "$STORE_PASSWORD_B64" | base64 -d)
          KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD_B64" | base64 -d)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          mkdir -p app/release
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/release/app-release.apk
          generate_release_notes: false
          body: |
            ## Installation

            1. Download `app-release.apk` below
            2. On your Android device, enable **Install unknown apps** for your browser
            3. Open the APK and install
            4. Open the app, tap the settings icon and set your PC's local IP
